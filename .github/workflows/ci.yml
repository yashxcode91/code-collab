name: CodeCollab CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '12.18.0'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/codecollab_test?schema=public'
  REDIS_URL: 'redis://localhost:6379'
  JWT_SECRET: 'super-secret-ci-jwt-test-key-32chars!!'
  JWT_REFRESH_SECRET: 'super-secret-ci-refresh-jwt-test-key-32chars!!'
  JWT_EXPIRES_IN: '15m'
  JWT_REFRESH_EXPIRES_IN_DAYS: '30'
  PORT: '4000'
  CLIENT_URL: 'http://localhost:5173'

jobs:
  # =========================================================================
  # JOB 1: Strict Static Analysis & Monorepo Typecheck
  # =========================================================================
  typecheck-and-lint:
    name: 🔍 Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client Types
        run: pnpm --filter @codecollab/database prisma generate

      - name: Build Shared Contracts
        run: pnpm --filter @codecollab/shared build

      - name: Strict TypeScript Verification across Workspaces
        run: |
          pnpm --filter @codecollab/shared exec tsc --noEmit
          pnpm --filter @codecollab/database exec tsc --noEmit
          pnpm --filter @codecollab/server exec tsc --noEmit
          pnpm --filter @codecollab/web exec tsc --noEmit

  # =========================================================================
  # JOB 2: Unit & Integration Test Suites with Live Service Containers
  # =========================================================================
  unit-and-integration-tests:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codecollab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Database Migrations
        run: pnpm --filter @codecollab/database prisma migrate deploy

      - name: Build Shared Package
        run: pnpm --filter @codecollab/shared build

      - name: Execute Server Vitest Suite
        run: pnpm --filter @codecollab/server test

      - name: Execute Web Component & Hook Vitest Suite
        run: pnpm --filter @codecollab/web test

  # =========================================================================
  # JOB 3: Playwright End-to-End (E2E) Browser Automation
  # =========================================================================
  e2e-playwright:
    name: 🎭 Playwright E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo (Shared + Web Production Assets)
        run: |
          pnpm --filter @codecollab/shared build
          pnpm --filter @codecollab/web build

      - name: Cache Playwright Chromium Binary
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Execute Playwright E2E Test Suite
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:5173'
        run: pnpm test:e2e

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 14

  # =========================================================================
  # JOB 4: Multi-Stage Docker Container Build Verification
  # =========================================================================
  docker-build-verification:
    name: 🐳 Docker Multi-Stage Image Builds
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile.server Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          tags: codecollab/server:test

      - name: Verify Dockerfile.web Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: codecollab/web:test

      - name: Verify Dockerfile.worker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: codecollab/worker:test
