# =====================================================================
# Devnolith Studio - Render Infrastructure-as-Code Blueprint
# Day 14: Cloud Production Launch on Render (100% Free Tier)
# =====================================================================

services:
  # -------------------------------------------------------------
  # 1. API Server, WebSocket Gateway & In-Process Worker (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: devnolith-api-server
    runtime: docker
    dockerfilePath: docker/Dockerfile.server
    dockerContext: .
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: EMBEDDED_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: devnolith-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: devnolith-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: EXECUTION_PUBSUB_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Web Application (Static Site - 100% Free CDN)
  # -------------------------------------------------------------
  - type: web
    name: devnolith-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@12.18.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @codecollab/shared run build && pnpm --filter @codecollab/web build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: devnolith-api-server
          property: host

  # -------------------------------------------------------------
  # 3. Managed Key Value Store (Redis / Valkey Broker - Free Tier)
  # -------------------------------------------------------------
  - type: keyvalue
    name: devnolith-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal access only

databases:
  # -------------------------------------------------------------
  # 4. Managed PostgreSQL 16 (PostgreSQL - Free Tier)
  # -------------------------------------------------------------
  - name: devnolith-postgres
    databaseName: devnolith_prod
    user: devnolith
    plan: free
    region: oregon
    postgresMajorVersion: 16
