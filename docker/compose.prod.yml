# =====================================================================
# Devnolith Production Multi-Container Orchestration Stack
# Day 14: Cloud Production Launch, Managed Database & Zero-Downtime Deployment
# =====================================================================

services:
  # -------------------------------------------------------------
  # 1. Edge Ingress: Nginx Reverse Proxy & Load Balancer
  # -------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: devnolith-prod-gateway
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
      - "5173:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - devnolith-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # -------------------------------------------------------------
  # 2. Frontend Web Application: Minified Vite SPA
  # -------------------------------------------------------------
  web:
    image: ghcr.io/yashxcode91/codecollab-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: devnolith-prod-web
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    expose:
      - "80"
    networks:
      - devnolith-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # -------------------------------------------------------------
  # 3. Core API Server: Express, WebSockets, CRDT & PTY Gateway
  # -------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: devnolith-prod-server
    user: root
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    expose:
      - "4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/devnolith-sandboxes:/tmp/devnolith-sandboxes
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devnolith_prod_secure_password_postgres}@postgres:5432/${POSTGRES_DB:-devnolith_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-devnolith_prod_secure_password_redis}@redis:6379
      CLIENT_URL: ${FRONTEND_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_ACCESS_SECRET:-${JWT_SECRET:-devnolith_default_access_secret_min_32_chars_ok}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${JWT_SECRET:-devnolith_default_access_secret_min_32_chars_ok}}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-devnolith_default_refresh_secret_min_32_chars_ok}
      CSRF_SECRET: ${CSRF_SECRET:-devnolith_default_csrf_secret_min_32_chars_ok}
      EXECUTION_PUBSUB_SECRET: ${EXECUTION_PUBSUB_SECRET:-devnolith_default_pubsub_secret_min_32_chars_ok}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      SANDBOX_WORKSPACE_DIR: /tmp/devnolith-sandboxes
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - devnolith-prod-network
      - codecollab-sandbox
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M

  # -------------------------------------------------------------
  # 4. Background Execution Worker: Isolated Sandbox Runner
  # -------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: devnolith-prod-worker
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/devnolith-runners:/tmp/devnolith-runners
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devnolith_prod_secure_password_postgres}@postgres:5432/${POSTGRES_DB:-devnolith_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-devnolith_prod_secure_password_redis}@redis:6379
      EXECUTION_PUBSUB_SECRET: ${EXECUTION_PUBSUB_SECRET:-devnolith_default_pubsub_secret_min_32_chars_ok}
      ALLOW_MISSING_RUNNER_IMAGES: "true"
      RUNNER_TEMP_DIR: /tmp/devnolith-runners
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devnolith-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # -------------------------------------------------------------
  # 5. Database Service: PostgreSQL 16 + pgvector Extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devnolith-prod-postgres
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devnolith_prod_secure_password_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devnolith_prod}
    volumes:
      - devnolith_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devnolith_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnolith-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # -------------------------------------------------------------
  # 6. Cache & Messaging Broker: Redis 7 Alpine
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: devnolith-prod-redis
    restart: always
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env
        required: false
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devnolith_prod_secure_password_redis}"]
    volumes:
      - devnolith_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devnolith_prod_secure_password_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnolith-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

# =====================================================================
# Persistent Data Volumes
# =====================================================================
volumes:
  devnolith_prod_postgres_data:
    name: devnolith_prod_postgres_data
  devnolith_prod_redis_data:
    name: devnolith_prod_redis_data

# =====================================================================
# Isolated Production Network
# =====================================================================
networks:
  devnolith-prod-network:
    name: devnolith_prod_network
    driver: bridge
  codecollab-sandbox:
    name: codecollab-sandbox
    driver: bridge
