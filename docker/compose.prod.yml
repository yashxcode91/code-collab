# =====================================================================
# CodeCollab Production Multi-Container Orchestration Stack
# Day 12: Production Hardening, Reverse Proxy & Zero-Downtime Deployment
# =====================================================================

services:
  # -------------------------------------------------------------
  # 1. Edge Ingress: Nginx Reverse Proxy & Load Balancer
  # -------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: codecollab-prod-gateway
    restart: always
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # -------------------------------------------------------------
  # 2. Frontend Web Application: Minified Vite SPA
  # -------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: codecollab-prod-web
    restart: always
    expose:
      - "80"
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # -------------------------------------------------------------
  # 3. Core API Server: Express, WebSockets, CRDT & PTY Gateway
  # -------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: codecollab-prod-server
    restart: always
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codecollab_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      EXECUTION_PUBSUB_SECRET: ${EXECUTION_PUBSUB_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M

  # -------------------------------------------------------------
  # 4. Background Execution Worker: Isolated Sandbox Runner
  # -------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: codecollab-prod-worker
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codecollab_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EXECUTION_PUBSUB_SECRET: ${EXECUTION_PUBSUB_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # -------------------------------------------------------------
  # 5. Database Service: PostgreSQL 16 + pgvector Extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codecollab-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-codecollab_prod}
    volumes:
      - codecollab_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codecollab_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # -------------------------------------------------------------
  # 6. Cache & Messaging Broker: Redis 7 Alpine
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codecollab-prod-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - codecollab_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecollab-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

# =====================================================================
# Persistent Data Volumes
# =====================================================================
volumes:
  codecollab_prod_postgres_data:
    name: codecollab_prod_postgres_data
  codecollab_prod_redis_data:
    name: codecollab_prod_redis_data

# =====================================================================
# Isolated Production Network
# =====================================================================
networks:
  codecollab-prod-network:
    name: codecollab_prod_network
    driver: bridge
