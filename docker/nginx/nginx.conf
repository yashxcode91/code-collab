# =====================================================================
# CodeCollab Production Reverse Proxy & API Gateway
# Handles HTTP/WebSocket routing, load balancing, rate limiting & SSL
# =====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-performance event delivery
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Gzip dynamic compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Global proxy rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=60r/s;

    # Upstream service clusters
    upstream backend_api {
        server server:4000;
        keepalive 32;
    }

    upstream frontend_spa {
        server web:80;
        keepalive 16;
    }

    # WebSocket connection upgrading map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Main Gateway Server Block
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Standard defense-in-depth headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 1. REST API Routing (/api/*)
        # -------------------------------------------------------------
        location /api/ {
            limit_req zone=api_gateway_limit burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------
        # 2. Real-Time Collaboration WebSocket (/socket.io/*)
        # -------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------
        # 3. Interactive Container Terminal PTY WebSocket (/terminal/*)
        # -------------------------------------------------------------
        location /terminal/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------
        # 4. Sandbox Preview Gateway Routing (/preview/*)
        # -------------------------------------------------------------
        location /preview/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow preview iframe rendering
            proxy_hide_header X-Frame-Options;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # -------------------------------------------------------------
        # 5. Frontend Web SPA Fallback (All other traffic)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Health endpoint for load balancers
        location /nginx-health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
